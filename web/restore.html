<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passapp — Restore</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-logo">
                <img src="logo.png" alt="Passapp">
            </div>
            
            <h1 class="card-title">Password Recovery</h1>
            <p class="card-subtitle">Enter your email to reset password</p>
            
            <div id="message" class="message"></div>
            
            <form id="restoreForm">
                <div class="form-group">
                    <label class="form-label" for="login">Email</label>
                    <input type="email" id="login" class="form-input" placeholder="your@email.com" required autocomplete="email">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Restore</button>
            </form>
            
            <div class="links">
                <a href="index.html">Back to Login</a>
                <a href="signup.html">Sign Up</a>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
