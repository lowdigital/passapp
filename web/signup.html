<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passapp — Sign Up</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="card">
            <div class="card-logo">
                <img src="logo.png" alt="Passapp">
            </div>
            
            <h1 class="card-title">Sign Up</h1>
            <p class="card-subtitle">Create a new account</p>
            
            <div id="message" class="message"></div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label class="form-label" for="login">Email</label>
                    <input type="email" id="login" class="form-input" placeholder="your@email.com" required autocomplete="email">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirm">Confirm Password</label>
                    <input type="password" id="confirm" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
                </div>
                
                <button type="submit" class="btn btn-primary btn-block">Create Account</button>
            </form>
            
            <div class="links">
                <a href="index.html">Already have an account?</a>
            </div>
        </div>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
