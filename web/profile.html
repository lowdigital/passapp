<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passapp — Profile</title>
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <a href="main.html" class="header-logo">
                <img src="logo.png" alt="Passapp">
                <span>Passapp</span>
            </a>
            <nav class="header-nav">
                <a href="main.html">Secrets</a>
                <a href="profile.html" class="active">Profile</a>
                <a href="#" onclick="logout(); return false;">Sign Out</a>
            </nav>
        </header>
        
        <main class="main-content">
            <div class="content-card" style="max-width: 480px;">
                <h2 class="content-title">Profile</h2>
                
                <div id="message" class="message"></div>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-input" disabled>
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="password">New Password</label>
                        <input type="password" id="password" class="form-input" placeholder="At least 6 characters" required autocomplete="new-password">
                    </div>
                    
                    <div class="form-group">
                        <label class="form-label" for="confirm">Confirm Password</label>
                        <input type="password" id="confirm" class="form-input" placeholder="Repeat password" required autocomplete="new-password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary btn-block">Change Password</button>
                </form>
            </div>
        </main>
    </div>
    
    <script src="js/app.js"></script>
</body>
</html>
