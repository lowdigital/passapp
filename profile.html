<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Passapp - Профиль</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="assets/plugins/global/plugins.bundle.css" rel="stylesheet" />
    <link href="assets/css/style.bundle.css" rel="stylesheet" />
</head>
<body style="background-color:#fdfdfd;">
<div class="container mt-4">
    <div class="card card-custom gutter-b">
        <div class="card-header">
            <div class="card-title">
                <h3 class="card-label" style="z-index: 1;">
                    Passapp
                </h3>
            </div>
            <div class="card-toolbar">
                <div class="topbar ">
                    <div class="topbar-item">
                        <div class="btn btn-icon btn-hover-transparent-white w-auto d-flex align-items-center btn-lg px-2" id="kt_quick_user_toggle">
                            <div class="d-flex flex-column text-right pr-3"></div>
                            <span class="symbol symbol-35 bg-primary">
                                <div class="dropdown bg-primary" style="border-radius: 10px; padding-left: 4px; padding-right: 4px;">
                                    <span class="symbol-label font-size-h5 font-weight-bold text-white bg-white-o-30 dropdown-toggle" data-toggle="dropdown" style="width: 40px;"><i class="fa fa-user"></i></span>
                                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">
                                        <a class="dropdown-item" href="main.html">Главная</a>
                                        <a class="dropdown-item" href="profile.html">Профиль</a>
                                        <a class="dropdown-item" href="#" onclick="logout()">Выход</a>
                                    </div>
                                </div>
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
            <form id="changePasswordForm" style="max-width:300px;">
                <div class="form-group">
                    <label for="email">Ваш Email:</label>
                    <input type="text" id="email" class="form-control" disabled>
                </div>
                <div class="form-group">
                    <label for="password">Новый пароль (мин. 6 символов):</label>
                    <input type="password" id="password" class="form-control" placeholder="Новый пароль" required>
                </div>
                <div class="form-group">
                    <label for="confirm">Подтвердите пароль:</label>
                    <input type="password" id="confirm" class="form-control" placeholder="Повторите пароль" required>
                </div>
                <button type="submit" class="btn btn-primary">Сменить пароль</button>
            </form>
        </div>
    </div>
</div>
<script src="cordova.js"></script>
<script src="assets/plugins/global/plugins.bundle.js"></script>
<script src="assets/js/scripts.bundle.js"></script>
<script src="vendor/jquery/jquery-2.2.4.min.js"></script>
<script>var KTAppSettings = {};</script>
<script src="js/app.js"></script>
</body>
</html>
