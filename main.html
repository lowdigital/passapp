<!DOCTYPE html><html lang="ru"><head>    <meta charset="UTF-8">    <title>Passapp - Главная</title>    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">    <link href="assets/plugins/global/plugins.bundle.css" rel="stylesheet" />    <link href="assets/css/style.bundle.css" rel="stylesheet" /></head><body style="background-color:#fdfdfd;"><div class="container mt-4">    <div class="card card-custom gutter-b">        <div class="card-header">            <div class="card-title">                <h3 class="card-label" style="z-index: 1;">                    Passapp                </h3>            </div>            <div class="card-toolbar">                <div class="topbar ">                    <div class="topbar-item">                        <div class="btn btn-icon btn-hover-transparent-white w-auto d-flex align-items-center btn-lg px-2" id="kt_quick_user_toggle">                            <div class="d-flex flex-column text-right pr-3"></div>                            <span class="symbol symbol-35 bg-primary">                                <div class="dropdown bg-primary" style="border-radius: 10px; padding-left: 4px; padding-right: 4px;">                                    <span class="symbol-label font-size-h5 font-weight-bold text-white bg-white-o-30 dropdown-toggle" data-toggle="dropdown" style="width: 40px;"><i class="fa fa-user"></i></span>                                    <div class="dropdown-menu" aria-labelledby="dropdownMenuButton">                                        <a class="dropdown-item" href="main.html">Главная</a>                                        <a class="dropdown-item" href="profile.html">Профиль</a>                                        <a class="dropdown-item" href="#" onclick="logout()">Выход</a>                                    </div>                                </div>                            </span>                        </div>                    </div>                </div>            </div>        </div>        <div class="card-body">            <input type="hidden" id="encrypted_data" value="">            <div class="form-group" id="masterkey_container">                <label for="masterpassword" id="masterpassword_label">Загрузка данных...</label>                <input class="form-control" type="password" id="masterpassword" placeholder="Введите ваш мастер-ключ">            </div>            <div role="group" aria-label="Кнопки" style="margin-bottom: 15px;">                <button type="button" onclick="decryptData()" class="btn btn-primary" id="decrypt_button" style="display:none;">Расшифровать</button>                <button type="button" onclick="createNewContent()" class="btn btn-primary" id="create_button" style="display:none;">Создать</button>                <button type="button" onclick="encryptData()" class="btn btn-success" id="save_button" style="display:none;">Сохранить</button>                <button type="button" onclick="changeMasterKey()" class="btn btn-secondary" id="change_key_button" style="display:none;">Сменить мастер-ключ</button>            </div>            <div id="editor_block" style="display:none;">                <div class="form-group">                    <label for="decrypted_data">Содержимое:</label>                    <textarea id="decrypted_data"></textarea>                </div>            </div>        </div>    </div></div><script src="cordova.js"></script><script src="assets/plugins/global/plugins.bundle.js"></script><script src="assets/js/scripts.bundle.js"></script><script src="vendor/jquery/jquery-2.2.4.min.js"></script><script src="vendor/tinymce/tinymce.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script><script>var KTAppSettings = {};</script><script src="js/app.js"></script></body></html>
