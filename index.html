<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Passapp - Вход</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="assets/plugins/global/plugins.bundle.css" rel="stylesheet" />
    <link href="assets/css/style.bundle.css" rel="stylesheet" />
</head>
<body>
<div id="overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#fff; z-index:9999;"></div>
<div class="d-flex flex-column flex-root">
    <div class="login d-flex flex-row-fluid" id="kt_login">
        <div class="d-flex flex-center flex-row-fluid" style="background-image: url('assets/media/bg/bg-3.jpg'); background-size:cover;">
            <div class="login-form text-center p-7 position-relative overflow-hidden">
                <div class="d-flex flex-center mb-15">
                    <img src="assets/media/logos/logo-letter-13.png" class="max-h-75px" alt="Logo" />
                </div>
                <div class="login-signin">
                    <div class="mb-20">
                        <h3>Passapp</h3>
                    </div>
                    <form id="loginForm" style="width:300px;">
                        <div class="error text-danger" id="error_message" style="display:none;"></div>

                        <div class="form-group mb-5">
                            <input class="form-control" type="text" placeholder="Логин (Email)" name="login" id="login" required autocomplete="off"/>
                        </div>
                        <div class="form-group mb-5">
                            <input class="form-control" type="password" placeholder="Пароль" name="password" id="password" required />
                        </div>

                        <button type="submit" class="btn btn-primary font-weight-bold px-9 py-4 my-3 mx-4">Войти</button>

                        <div class="mt-5">
                            <a href="signup.html" class="mr-3">Регистрация</a>
                            <a href="restore.html">Забыли пароль?</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="cordova.js"></script>
<script src="assets/plugins/global/plugins.bundle.js"></script>
<script src="assets/js/scripts.bundle.js"></script>
<script src="vendor/jquery/jquery-2.2.4.min.js"></script>
<script>var KTAppSettings = {};</script>
<script src="js/app.js"></script>
</body>
</html>
